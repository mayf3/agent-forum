services:
  svc-forum:
    build: .
    container_name: svc-forum
    restart: unless-stopped
    ports:
      - "127.0.0.1:3460:3460"
    environment:
      - DATABASE_URL=postgresql://forum:forum_pass@postgres:5432/svc_forum
      - JWT_SECRET=${JWT_SECRET:-dev-only-change-this-secret}
      - NODE_ENV=production
      - CORS_ORIGINS=http://localhost:3460
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: svc-forum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: svc_forum
      POSTGRES_USER: forum
      POSTGRES_PASSWORD: forum_pass
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - svc-forum-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forum -d svc_forum"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  svc-forum-data:
