name: Correct Governance acceptance route validation

on:
  push:
    branches:
      - automation/fix-accept-governance-adoption-v2-r1

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch acceptance automation and retrigger
        shell: bash
        run: |
          set -euo pipefail
          target=automation/accept-governance-adoption-v2
          git fetch origin "$target"
          git checkout -B "$target" "origin/$target"
          file=.github/workflows/accept-governance-adoption-v2.yml
          sed -i 's/"route_stage": "AUTHORITY_ACCEPTANCE"/"route_stage": "AUTHORITY_AUTHORING"/' "$file"
          sed -i 's/"plan": {"complexity": "STANDARD", "level": "CHANGE_BRIEF"}/"plan": {"complexity": "COMPLEX", "level": "EXEC_PLAN"}/' "$file"
          sed -i 's/"full_rereview_required": false/"full_rereview_required": true/' "$file"
          grep -F '"route_stage": "AUTHORITY_AUTHORING"' "$file"
          grep -F '"plan": {"complexity": "COMPLEX", "level": "EXEC_PLAN"}' "$file"
          grep -F '"full_rereview_required": true' "$file"
          git config user.name "OpenAI ChatGPT"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$file"
          git commit -m "ci: correct Governance acceptance route validation"
          git push origin "HEAD:$target"
