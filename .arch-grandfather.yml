# 每个条目需带复审期限（expiry），过期自动失效

grandfather:
  - pattern: "src/lib/data-access.ts"
    lines: 1004
    reason: "历史最大文件，已有拆分需求 fdbff530 处理"
    reviewer: "arch-reviewer"
    date: "2026-08-05"
    expiry: "2026-08-31"
    # 拆分需求完成后此条目自动失效（expiry 到期或 pattern 不再匹配）
